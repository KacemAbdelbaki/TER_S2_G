name: Build native desktop packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: ':lwjgl3:packageLinux'
            artifact_dir: 'RA/labyrinth_ui/lwjgl3/build/jpackage/PacmanLabyrinth'
            asset_name: 'PacmanLabyrinth-linux'
          - os: windows-latest
            task: ':lwjgl3:packageWindows'
            artifact_dir: 'RA/labyrinth_ui/lwjgl3/build/jpackage/PacmanLabyrinth'
            asset_name: 'PacmanLabyrinth-windows'
          - os: macos-latest
            task: ':lwjgl3:packageMac'
            artifact_dir: 'RA/labyrinth_ui/lwjgl3/build/jpackage/PacmanLabyrinth.app'
            asset_name: 'PacmanLabyrinth-macos'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        working-directory: RA/labyrinth_ui
        run: chmod +x ./gradlew

      - name: Build native package
        working-directory: RA/labyrinth_ui
        shell: bash
        run: ./gradlew ${{ matrix.task }} --no-daemon --stacktrace

      - name: Verify artifact exists
        shell: bash
        run: |
          if [ ! -e "${{ matrix.artifact_dir }}" ]; then
            echo "Expected artifact not found at ${{ matrix.artifact_dir }}"
            exit 1
          fi
          ls -la "${{ matrix.artifact_dir }}"

      - name: Zip artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd "$(dirname '${{ matrix.artifact_dir }}')"
          zip -r -y "${{ github.workspace }}/${{ matrix.asset_name }}.zip" "$(basename '${{ matrix.artifact_dir }}')"

      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parent = Split-Path -Parent '${{ matrix.artifact_dir }}'
          $leaf   = Split-Path -Leaf   '${{ matrix.artifact_dir }}'
          Compress-Archive -Path "$parent\$leaf" -DestinationPath "${{ github.workspace }}\${{ matrix.asset_name }}.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f -name '*.zip'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
